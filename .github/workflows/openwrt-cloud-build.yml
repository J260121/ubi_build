name: ImmortalWrt Builder DIY

on:
  repository_dispatch:
    types: ["Source Code Update"]

  workflow_dispatch:
    inputs:
      device:
        description: "编译设备型号"
        required: true
        type: choice
        default: "all"
        options:
          - "512M"
          - "256M"
          - "128M"
          - "QLB-4Pro"
          - "ikuai-q6000-nand"
          - "all"

      repo:
        description: "指定源码仓库地址"
        required: true
        type: string
        default: "https://github.com/padavanonly/immortalwrt-mt798x-6.6.git"

      branch:
        description: "指定源码 Branch"
        required: false
        type: string
        default: "openwrt-24.10-6.6"

      commit:
        description: "指定源码 Commit，留空使用 Branch 最新代码"
        required: false
        type: string
        default: ""

      #ssh:
        #description: "开启 SSH 配置，仅单设备有效"
        #required: false
        #type: boolean
        #default: false

      release:
        description: "发布到 GitHub Release"
        required: false
        type: boolean
        default: true

      prerelease:
        description: "预发布版本"
        required: false
        type: boolean
        default: false


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  TZ: Asia/Shanghai

  # ----------------------------------------------------------
  # 编译设备
  # ----------------------------------------------------------

  DEVICE_INPUT: ${{ github.event.inputs.device || github.event.client_payload.device || 'all' }}

  # ----------------------------------------------------------
  # ImmortalWrt
  # ----------------------------------------------------------

  REPO_URL: ${{ github.event.inputs.repo || github.event.client_payload.repo || 'https://github.com/padavanonly/immortalwrt-mt798x-6.6' }}

  REPO_BRANCH: ${{ github.event.inputs.branch || github.event.client_payload.branch || 'openwrt-24.10-6.6' }}

  REPO_COMMIT: ${{ github.event.inputs.commit || github.event.client_payload.commit || '' }}

  # ----------------------------------------------------------
  # Ccache
  # ----------------------------------------------------------

  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 6G

  # ----------------------------------------------------------
  # 编译目录
  # ----------------------------------------------------------

  OPENWRT_DIR: /workdir/openwrt

  # ----------------------------------------------------------
  # Release
  # ----------------------------------------------------------

  UPLOAD_RELEASE: ${{ github.event.inputs.release || github.event.client_payload.release || 'true' }}

  PRERELEASE: ${{ github.event.inputs.prerelease || github.event.client_payload.prerelease || 'false' }}


jobs:
  build:
    name: "🔨 Build Firmware"
    runs-on: ubuntu-22.04

    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # 编译环境
      # ========================================================

      - name: Init Environment
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo rm -rf \
            /etc/apt/sources.list.d/* \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc

          sudo apt-get update -qq

          sudo apt-get install -y \
            libncurses5-dev \
            libncurses-dev \
            liblzo2-dev \
            lzop \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            mkisofs \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd

          sudo apt-get clean

          sudo timedatectl set-timezone "$TZ"

          sudo mkdir -p /workdir

          sudo chown -R \
            "$(id -u):$(id -g)" \
            /workdir


      # ========================================================
      # Clone ImmortalWrt
      # ========================================================

      - name: Clone Source
        working-directory: /workdir
        shell: bash
        run: |
          set -e

          git clone \
            "$REPO_URL" \
            -b "$REPO_BRANCH" \
            --single-branch \
            --filter=blob:none \
            openwrt

          cd openwrt

          if [ -n "$REPO_COMMIT" ]; then

            git fetch \
              --depth=1 \
              origin \
              "$REPO_COMMIT"

            git checkout "$REPO_COMMIT"

          fi

          echo "========================================"
          echo "IMMORTALWRT"
          echo "========================================"

          echo "Branch:"
          git branch --show-current

          echo

          echo "Commit:"
          git rev-parse HEAD


      # ========================================================
      # DIY Scripts
      # ========================================================

      - name: Prepare Files And Scripts
        shell: bash
        run: |
          set -e
          cd "$OPENWRT_DIR"
          cp -f $GITHUB_WORKSPACE/*.sh ./
          cp -f $GITHUB_WORKSPACE/dts/* ./target/linux/mediatek/dts/

      # ========================================================
      # Load Scripts
      # ========================================================

      - name: Load Scripts
        shell: bash
        run: |
          set -e
          cd "$OPENWRT_DIR"
          chmod +x $GITHUB_WORKSPACE/*.sh

          case "$DEVICE_INPUT" in
            512M)
              echo "========================================"
              echo "Apply TR3000 512M"
              echo "========================================"
              "$GITHUB_WORKSPACE/diy-part2.sh"
              ;;
            256M)
              echo "========================================"
              echo "TR3000 256M"
              echo "========================================"
              "$GITHUB_WORKSPACE/diy-part2.sh"
              ;;
            128M)
              echo "========================================"
              echo "TR3000 128M"
              echo "========================================"
              "$GITHUB_WORKSPACE/diy-part2.sh"
              ;;
            QLB-4Pro)
              echo "========================================"
              echo "Apply QLB-4Pro"
              echo "========================================"
              "$GITHUB_WORKSPACE/diy-qlb.sh"
              ;;
            ikuai-q6000-nand)
              echo "========================================"
              echo "Apply ikuai-q6000-nand"
              echo "========================================"
              "$GITHUB_WORKSPACE/diy-ikuai-q6000-nand.sh"
              ;;
            all)
              echo "========================================"
              echo "Apply all device definitions"
              echo "========================================"
              # 512M device definition
              "$GITHUB_WORKSPACE/diy-part2.sh"
              # QLB-4Pro device definition
              "$GITHUB_WORKSPACE/diy-qlb.sh"
              # ikuai-q6000-nand device definition
              "$GITHUB_WORKSPACE/diy-ikuai-q6000-nand.sh"
              ;;
            *)
              echo "Unknown device: $DEVICE_INPUT"
              exit 1
              ;;
          esac

      # ========================================================
      # Rebuilt Config
      # ========================================================

      - name: Feed And Rebuilt Config
        id: config-hash
        shell: bash
        run: |
          set -e
          cd "$OPENWRT_DIR"

          if [ "$DEVICE_INPUT" = "all" ]; then
            DEVICES="512M 256M 128M QLB-4Pro ikuai-q6000-nand"
          else
            DEVICES="$DEVICE_INPUT"
          fi

          mkdir -p \
            "$GITHUB_WORKSPACE/firmware_collection"

          cd "$OPENWRT_DIR"


          for DEV in $DEVICES; do

            echo
            echo "::group::🚀 Building $DEV"

            case "$DEV" in

              512M)
                CONFIG="$GITHUB_WORKSPACE/config/512m.config"
                ;;

              256M)
                CONFIG="$GITHUB_WORKSPACE/config/256m.config"
                ;;

              128M)
                CONFIG="$GITHUB_WORKSPACE/config/128m.config"
                ;;

              QLB-4Pro)
                CONFIG="$GITHUB_WORKSPACE/config/mt7981-QLB-4Pro.config"
                ;;
              ikuai-q6000-nand)
                CONFIG="$GITHUB_WORKSPACE/config/mt7986-ikuai-q6000-nand.config"
                ;;
              *)
                echo "Unknown device: $DEV"
                exit 1
                ;;

            esac


            echo "========================================"
            echo "DEVICE: $DEV"
            echo "CONFIG: $CONFIG"
            echo "========================================"


            # --------------------------------------------------
            # 写入设备 Config
            # --------------------------------------------------


          cp -f "$CONFIG" .config
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          "$GITHUB_WORKSPACE/diy-part1.sh" 
          "$GITHUB_WORKSPACE/diy-part3.sh"
          "$GITHUB_WORKSPACE/install_passwall2.sh"
          
          make defconfig

          CONFIG_HASH=$(md5sum .config | awk '{print $1}')

          echo "hash=$CONFIG_HASH" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "CONFIG HASH"
          echo "========================================"

          echo "$CONFIG_HASH"


      # ========================================================
      # Ccache Cache
      # ========================================================

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache

          key: >-
            ${{ runner.os }}-ccache-
            ${{ env.REPO_BRANCH }}-
            ${{ steps.config-hash.outputs.hash }}-
            ${{ hashFiles('*.sh', 'config/*.config', 'dts/*') }}

          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}-
            ${{ runner.os }}-ccache-


      # ========================================================
      # Download Cache
      #
      # 不绑定 config。
      # 不同设备共享下载缓存。
      # ========================================================

      - name: Cache DL
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl

          key: >-
            ${{ runner.os }}-openwrt-dl-
            ${{ env.REPO_BRANCH }}-
            ${{ hashFiles('feeds.conf.default') }}

          restore-keys: |
            ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-
            ${{ runner.os }}-openwrt-dl-


      # ========================================================
      # Configure Ccache
      # ========================================================

      - name: Configure Ccache
        shell: bash
        run: |
          set -e

          mkdir -p "$CCACHE_DIR"

          ccache \
            --set-config=max_size="$CCACHE_MAXSIZE"

          ccache \
            --set-config=cache_dir="$CCACHE_DIR"

          ccache \
            --set-config=compression=true

          ccache \
            --set-config=compression_level=6

          ccache -z


      # ========================================================
      # Download
      # 全部设备只 download 一次。
      # ========================================================

      - name: Download Sources
        shell: bash
        run: |
          set -e

          cd "$OPENWRT_DIR"

          make download -j"$(nproc)"

          find dl \
            -size -1024c \
            -exec rm -f {} \;


      # ========================================================
      # Compile Loop
      # ========================================================

      - name: Compile Loop
        id: compile
        shell: bash
        run: |
          set -e

            # --------------------------------------------------
            # 显示 Target
            # --------------------------------------------------

            grep '^CONFIG_TARGET_' .config \
              | grep '=y' \
              || true


            # --------------------------------------------------
            # 编译
            # --------------------------------------------------

            if make \
              -j"$(nproc)" \
              CC="ccache gcc" \
              CXX="ccache g++"
            then

              echo "========================================"
              echo "✅ $DEV BUILD SUCCESS"
              echo "========================================"

            else

              echo "========================================"
              echo "⚠️ $DEV PARALLEL BUILD FAILED"
              echo "Retry with V=s"
              echo "========================================"

              make \
                -j1 \
                V=s \
                CC="ccache gcc" \
                CXX="ccache g++"

            fi


            # --------------------------------------------------
            # 收集当前设备
            # --------------------------------------------------

            mkdir -p \
              "$GITHUB_WORKSPACE/firmware_collection/$DEV"


            find bin/targets \
              -type f \
              \( \
                -name "*.bin" \
                -o -name "*.itb" \
                -o -name "*.img" \
                -o -name "*.tar" \
                -o -name "*.gz" \
                -o -name "*.zip" \
              \) \
              -exec cp -f {} \
              "$GITHUB_WORKSPACE/firmware_collection/$DEV/" \;


            echo "::endgroup::"

          done


          echo "status=success" >> "$GITHUB_OUTPUT"


      # ========================================================
      # Ccache Statistics
      # ========================================================

      - name: Ccache Statistics
        if: always()
        shell: bash
        run: |
          ccache -s || true


      # ========================================================
      # 上传 Artifact
      # ========================================================

      - name: Upload Artifacts
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_${{ env.DEVICE_INPUT }}
          path: ${{ github.workspace }}/firmware_collection/
          if-no-files-found: error
          compression-level: 9


      # ========================================================
      # Release
      # ========================================================

      - name: Generate Release
        id: tag
        if: >
          steps.compile.outputs.status == 'success' &&
          env.UPLOAD_RELEASE == 'true'
        shell: bash
        run: |
          set -e

          BUILD_TIME=$(date +"%Y.%m.%d-%H%M")

          echo "release_tag=$BUILD_TIME" >> "$GITHUB_OUTPUT"

          cat > release.txt << EOF
          ## 📦 ImmortalWrt Firmware

          **Build Time:** $BUILD_TIME

          **Branch:** $REPO_BRANCH

          **Commit:** $(cd "$OPENWRT_DIR" && git rev-parse --short HEAD)

          **Device:** $DEVICE_INPUT

          **Repository:** $REPO_URL
          EOF

          echo "status=success" >> "$GITHUB_OUTPUT"


      # ========================================================
      # Upload Release
      # ========================================================

      - name: Upload Release
        if: steps.tag.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          prerelease: ${{ env.PRERELEASE == 'true' }}

          files: |
            firmware_collection/**/*.bin
            firmware_collection/**/*.itb
            firmware_collection/**/*.img
            firmware_collection/**/*.tar
            firmware_collection/**/*.gz
            firmware_collection/**/*.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ========================================================
      # 清理旧 Workflow
      # ========================================================

      - name: Clean Old Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 9


      # ========================================================
      # 清理旧 Release
      # ========================================================

      - name: Clean Old Releases
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
