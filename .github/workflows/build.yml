```yaml
name: Cudy TR3000 ImmortalWrt Builder

on:
  workflow_dispatch:
    inputs:

      branch:
        description: "ImmortalWrt branch"
        required: true
        default: "master"
        type: string

      config:
        description: "Default config file"
        required: true
        default: "config/mt7981-QLB-4Pro.config"
        type: string

      ssh:
        description: "Enable SSH for menuconfig"
        required: true
        default: false
        type: boolean

      clean:
        description: "Clean build cache"
        required: true
        default: false
        type: boolean

      make_jobs:
        description: "Compile jobs"
        required: true
        default: "4"
        type: string

  repository_dispatch:
    types:
      - Source Code Update

permissions:
  contents: read

concurrency:
  group: cudy-immortalwrt-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
  SOURCE_DIR: openwrt
  CUSTOM_DIR: cudy
  TZ: Asia/Shanghai

jobs:

  build:
    name: Build Cudy TR3000
    runs-on: ubuntu-24.04

    timeout-minutes: 360

    steps:

      # ========================================================
      # 1. Checkout ubi_build
      # ========================================================

      - name: Checkout custom repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ========================================================
      # 2. 安装编译依赖
      # ========================================================

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            rsync \
            subversion \
            swig \
            texinfo \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev \
            zstd

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      # ========================================================
      # 3. 配置 ccache
      # ========================================================

      - name: Configure ccache
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/.ccache"

          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=8G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content

          ccache --zero-stats

      # ========================================================
      # 4. 恢复编译缓存
      # ========================================================

      - name: Restore ccache
        if: ${{ !inputs.clean }}
        uses: actions/cache@v4
        with:
          path: .ccache
          key: cudy-immortalwrt-ccache-${{ runner.os }}-${{ hashFiles('config/**', 'dts/**', 'package/**', 'diy-part*.sh') }}
          restore-keys: |
            cudy-immortalwrt-ccache-${{ runner.os }}-

      # ========================================================
      # 5. 创建目录
      # ========================================================

      - name: Prepare workspace
        run: |
          set -eux

          mkdir -p "$CUSTOM_DIR"
          mkdir -p "$SOURCE_DIR"

          echo "Workspace:"
          pwd

      # ========================================================
      # 6. 保存自定义文件
      # ========================================================

      - name: Prepare custom files
        run: |
          set -eux

          cp -a config "$CUSTOM_DIR/" 2>/dev/null || true
          cp -a dts "$CUSTOM_DIR/" 2>/dev/null || true
          cp -a package "$CUSTOM_DIR/" 2>/dev/null || true
          cp -a files "$CUSTOM_DIR/" 2>/dev/null || true

          cp -a diy-part1.sh "$CUSTOM_DIR/" 2>/dev/null || true
          cp -a diy-part2.sh "$CUSTOM_DIR/" 2>/dev/null || true

          find "$CUSTOM_DIR" -maxdepth 5 -type f | sort

      # ========================================================
      # 7. 克隆官方 ImmortalWrt
      # ========================================================

      - name: Clone ImmortalWrt
        run: |
          set -eux

          BRANCH="${{ inputs.branch }}"

          if [ -z "$BRANCH" ]; then
            BRANCH="master"
          fi

          rm -rf "$SOURCE_DIR"

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$BRANCH" \
            "$SOURCE_REPO" \
            "$SOURCE_DIR"

          cd "$SOURCE_DIR"

          echo
          echo "========================================"
          echo "ImmortalWrt"
          echo "========================================"

          git log -1 --oneline
          git rev-parse HEAD

      # ========================================================
      # 8. 保存源码版本
      # ========================================================

      - name: Generate build information
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux

          echo "BUILD_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_FULL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      # ========================================================
      # 9. 注入 DTS
      # ========================================================

      - name: Install custom DTS
        run: |
          set -eux

          if [ -d "$CUSTOM_DIR/dts" ]; then

            mkdir -p \
              "$SOURCE_DIR/target/linux/mediatek/dts"

            cp -a \
              "$CUSTOM_DIR/dts/." \
              "$SOURCE_DIR/target/linux/mediatek/dts/"

          fi

          echo
          echo "Installed DTS:"
          find \
            "$SOURCE_DIR/target/linux/mediatek/dts" \
            -type f \
            | sort \
            | tail -100

      # ========================================================
      # 10. 注入 package
      # ========================================================

      - name: Install custom packages
        run: |
          set -eux

          if [ -d "$CUSTOM_DIR/package" ]; then

            cp -a \
              "$CUSTOM_DIR/package/." \
              "$SOURCE_DIR/package/"

          fi

      # ========================================================
      # 11. 注入 files
      # ========================================================

      - name: Install custom files
        run: |
          set -eux

          if [ -d "$CUSTOM_DIR/files" ]; then

            mkdir -p "$SOURCE_DIR/files"

            cp -a \
              "$CUSTOM_DIR/files/." \
              "$SOURCE_DIR/files/"

          fi

      # ========================================================
      # 12. DIY part 1
      #
      # feeds update 之前
      # ========================================================

      - name: Install DIY part1
        run: |
          set -eux

          if [ -f "$CUSTOM_DIR/diy-part1.sh" ]; then

            cp \
              "$CUSTOM_DIR/diy-part1.sh" \
              "$SOURCE_DIR/diy-part1.sh"

            sed -i 's/\r$//' \
              "$SOURCE_DIR/diy-part1.sh"

            chmod +x \
              "$SOURCE_DIR/diy-part1.sh"

            bash -n \
              "$SOURCE_DIR/diy-part1.sh"

          fi

      - name: Run DIY part1
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux

          if [ -f ./diy-part1.sh ]; then
            ./diy-part1.sh
          fi

      # ========================================================
      # 13. feeds
      # ========================================================

      - name: Update feeds
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux

          ./scripts/feeds update -a

      - name: Install feeds
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux

          ./scripts/feeds install -a

      # ========================================================
      # 14. DIY part 2
      #
      # feeds 完成之后
      # ========================================================

      - name: Install DIY part2
        run: |
          set -eux

          if [ -f "$CUSTOM_DIR/diy-part2.sh" ]; then

            cp \
              "$CUSTOM_DIR/diy-part2.sh" \
              "$SOURCE_DIR/diy-part2.sh"

            sed -i 's/\r$//' \
              "$SOURCE_DIR/diy-part2.sh"

            chmod +x \
              "$SOURCE_DIR/diy-part2.sh"

            bash -n \
              "$SOURCE_DIR/diy-part2.sh"

          fi

      - name: Run DIY part2
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux

          if [ -f ./diy-part2.sh ]; then
            ./diy-part2.sh
          fi

      # ========================================================
      # 15. 安装默认 config
      # ========================================================

      - name: Install default config
        run: |
          set -eux

          CONFIG="${{ inputs.config }}"

          if [ -f "$CUSTOM_DIR/$CONFIG" ]; then

            cp -f \
              "$CUSTOM_DIR/$CONFIG" \
              "$SOURCE_DIR/.config"

          elif [ -f "$CONFIG" ]; then

            cp -f \
              "$CONFIG" \
              "$SOURCE_DIR/.config"

          else

            echo "Config not found:"
            echo "$CONFIG"

            find "$CUSTOM_DIR/config" \
              -type f \
              2>/dev/null \
              | sort

            exit 1

          fi

      # ========================================================
      # 16. SSH menuconfig
      #
      # 开启后：
      #
      # SSH -> cd openwrt
      #      make menuconfig
      #
      # 保存退出
      # Ctrl+D / exit
      #
      # Actions 会继续执行
      # ========================================================

      - name: SSH connection to Actions
        if: ${{ inputs.ssh }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 120
        with:
          limit-access-to-actor: true

      # ========================================================
      # 17. 检查 menuconfig 结果
      # ========================================================

      - name: Check configuration
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux

          echo
          echo "========================================"
          echo "Current target"
          echo "========================================"

          grep '^CONFIG_TARGET' .config || true

          echo
          echo "========================================"
          echo "Selected packages"
          echo "========================================"

          grep '^CONFIG_PACKAGE_.*=y' .config \
            | sort \
            | head -200 || true

      # ========================================================
      # 18. 最终 defconfig
      # ========================================================

      - name: Generate final config
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux

          make defconfig

          cp \
            .config \
            ../final.config

      # ========================================================
      # 19. 下载源码
      # ========================================================

      - name: Download sources
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux

          make download \
            -j${{ inputs.make_jobs }}

      # ========================================================
      # 20. 编译工具链
      # ========================================================

      - name: Build toolchain
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -eux

          make toolchain/compile \
            -j${{ inputs.make_jobs }} \
            V=s

      # ========================================================
      # 21. 编译固件
      # ========================================================

      - name: Build firmware
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -o pipefail

          make \
            -j${{ inputs.make_jobs }} \
            V=s \
            2>&1 | tee ../build.log

      # ========================================================
      # 22. 固件信息
      # ========================================================

      - name: Generate firmware information
        if: ${{ success() }}
        run: |
          set -eux

          TARGET_DIR="$SOURCE_DIR/bin/targets"

          cat > "$TARGET_DIR/build-info.txt" <<EOF
          ========================================
          Cudy TR3000 ImmortalWrt
          ========================================

          Build date:
          $BUILD_DATE

          Commit:
          $BUILD_FULL_COMMIT

          Config:
          ${{ inputs.config }}

          Jobs:
          ${{ inputs.make_jobs }}

          ========================================
          Firmware
          ========================================
          EOF

          find "$TARGET_DIR" \
            -type f \
            | sort >> "$TARGET_DIR/build-info.txt"

      # ========================================================
      # 23. 显示固件
      # ========================================================

      - name: List firmware
        if: ${{ always() }}
        run: |
          echo
          echo "========================================"
          echo "Firmware"
          echo "========================================"

          find \
            "$SOURCE_DIR/bin/targets" \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.itb" \
              -o -name "*.ubi" \
              -o -name "*.img" \
              -o -name "*.tar.gz" \
            \) \
            -exec ls -lh {} \; \
            2>/dev/null || true

      # ========================================================
      # 24. ccache
      # ========================================================

      - name: Ccache statistics
        if: ${{ always() }}
        run: |
          ccache --show-stats || true

      # ========================================================
      # 25. 磁盘
      # ========================================================

      - name: Disk usage
        if: ${{ always() }}
        run: |
          df -h

      # ========================================================
      # 26. 上传固件
      # ========================================================

      - name: Upload firmware
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Cudy-TR3000-ImmortalWrt-${{ env.BUILD_COMMIT }}
          path: |
            openwrt/bin/targets/**/*
          if-no-files-found: error
          retention-days: 14

      # ========================================================
      # 27. 上传最终 config
      # ========================================================

      - name: Upload final config
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Cudy-TR3000-config-${{ github.run_number }}
          path: |
            final.config
          if-no-files-found: ignore
          retention-days: 14

      # ========================================================
      # 28. 上传日志
      # ========================================================

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Cudy-TR3000-build-log-${{ github.run_number }}
          path: |
            build.log
          if-no-files-found: ignore
          retention-days: 14
```
