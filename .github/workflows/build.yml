
name: Build OpenWrt for Multiple Devices

on:
  workflow_dispatch:
    inputs:
      device_profile:
        description: '选择目标设备配置'
        required: true
        default: '128m'
        type: choice
        options:
          - 128m
          - cmcc_rax3000m-emmc
          - jdcloud_re-cp-03
          - xiaomi_mi-router-ax3000t
      use_daed:
        description: '集成 Daed 代理客户端'
        required: false
        default: 'true'
        type: boolean
      clean_build:
        description: '执行完全清理编译 (慢但稳定)'
        required: false
        default: 'false'
        type: boolean

env:
  REPO_URL: https://github.com/J260121/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
        g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
        libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
        libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
        ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
        python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
        upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone Source Code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load Custom Configuration
      run: |
        cd openwrt
        # Update feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # Dynamic Config Loading based on input
        CONFIG_FILE="defconfig/${{ github.event.inputs.device_profile }}.config"
        
        if [ -f "$CONFIG_FILE" ]; then
            echo "Loading config: $CONFIG_FILE"
            cp -f "$CONFIG_FILE" .config
        else
            echo "Warning: Config $CONFIG_FILE not found. Falling back to generic mt7981-ax3000."
            cp -f "defconfig/mt7981-ax3000.config" .config
        fi
        
        # Inject optional packages
        if [ "${{ github.event.inputs.use_daed }}" == "true" ]; then
            echo 'CONFIG_PACKAGE_luci-app-daed=y' >> .config
            echo 'CONFIG_PACKAGE_daed=y' >> .config
        fi

        # Apply final config
        make defconfig

    - name: Download Feeds & Packages
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      run: |
        cd openwrt
        
        # Handle clean build if requested
        if [ "${{ github.event.inputs.clean_build }}" == "true" ]; then
            make clean
        fi

        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        
        # Extract device name for artifact naming
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check Space Usage
      if: (!cancelled())
      run: df -hT

    - name: Upload Bin Directory
      if: steps.compile.outputs.status == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_Bin${{ env.DEVICE_NAME }}-${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize Files for Release
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware to Release
      if: steps.organize.outputs.status == 'success' && !cancelled()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.FILE_DATE }}
        body: |
          Auto-built OpenWrt for ${{ github.event.inputs.device_profile }}
          Date: ${{ env.FILE_DATE }}
          Include Daed: ${{ github.event.inputs.use_daed }}
          Clean Build: ${{ github.event.inputs.clean_build }}
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
