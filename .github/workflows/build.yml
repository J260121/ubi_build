name: ImmortalWrt MT798x Cloud Builder

on:
  workflow_dispatch:
    inputs:

      mode:
        description: "编译模式"
        required: true
        type: choice
        default: build
        options:
          - build
          - menuconfig

      device:
        description: "设备"
        required: true
        type: choice
        default: QLB-4Pro
        options:
          - QLB-4Pro

      repo:
        description: "ImmortalWrt 源码仓库"
        required: true
        type: string
        default: "https://github.com/padavanonly/immortalwrt-mt798x-6.6"

      branch:
        description: "源码分支"
        required: true
        type: string
        default: "openwrt-24.10-6.6"

      commit:
        description: "指定 Commit / Tag，留空使用分支最新版本"
        required: false
        type: string
        default: ""

      ssh:
        description: "启用 SSH 调试"
        required: true
        type: boolean
        default: false

      clean:
        description: "清理编译缓存"
        required: true
        type: boolean
        default: false


concurrency:
  group: immortalwrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  TZ: Asia/Shanghai

  WORKDIR: /workdir
  OPENWRT_DIR: /workdir/openwrt

  CUDY_DIR: ${{ github.workspace }}/cudy

  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 8G


jobs:

  # ==========================================================
  # MENUCONFIG / SSH
  # ==========================================================

  menuconfig:

    name: "⚙️ Menuconfig / SSH"

    if: |
      github.event.inputs.mode == 'menuconfig' ||
      github.event.inputs.ssh == 'true'

    runs-on: ubuntu-22.04

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Custom Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Install Dependencies
      # ------------------------------------------------------

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |

          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            rsync \
            unzip \
            zip \
            bzip2 \
            xz-utils \
            python3 \
            python3-pip \
            python3-setuptools \
            libncurses-dev \
            zlib1g-dev \
            libssl-dev \
            gawk \
            gettext \
            file \
            patch \
            diffutils \
            ccache


      # ------------------------------------------------------
      # Prepare Workdir
      # ------------------------------------------------------

      - name: Prepare Work Directory
        run: |

          set -eux

          sudo mkdir -p "$WORKDIR"

          sudo chown -R \
            "$USER:$USER" \
            "$WORKDIR"


      # ------------------------------------------------------
      # Clone ImmortalWrt
      # ------------------------------------------------------

      - name: Clone ImmortalWrt
        working-directory: /workdir
        run: |

          set -eux

          git clone \
            --depth=1 \
            --single-branch \
            -b "${{ github.event.inputs.branch }}" \
            "${{ github.event.inputs.repo }}" \
            openwrt


          cd "$OPENWRT_DIR"


          if [ -n "${{ github.event.inputs.commit }}" ]; then

            git fetch \
              --depth=1 \
              origin \
              "${{ github.event.inputs.commit }}"

            git checkout \
              "${{ github.event.inputs.commit }}"

          fi


          echo "========================================"
          echo "ImmortalWrt source"
          echo "========================================"

          git remote -v
          git log -1 --oneline


      # ------------------------------------------------------
      # Copy Custom Files
      # ------------------------------------------------------

      - name: Copy Cudy Custom Files
        run: |

          set -eux


          OPENWRT="$OPENWRT_DIR"
          CUDY="$CUDY_DIR"


          echo "========================================"
          echo "CUDY DIRECTORY"
          echo "$CUDY"
          echo "========================================"


          if [ ! -d "$CUDY" ]; then

            echo "ERROR: CUDY directory not found"

            exit 1

          fi


          echo "========================================"
          echo "CUDY FILES"
          echo "========================================"

          find "$CUDY" \
            -maxdepth 5 \
            -type f \
            -print | sort


          # ==================================================
          # DTS
          # ==================================================

          if [ -d "$CUDY/dts" ]; then

            mkdir -p \
              "$OPENWRT/target/linux/mediatek/dts"

            cp -a \
              "$CUDY/dts/." \
              "$OPENWRT/target/linux/mediatek/dts/"

          fi


          # ==================================================
          # PACKAGE
          # ==================================================

          if [ -d "$CUDY/package" ]; then

            mkdir -p \
              "$OPENWRT/package"

            cp -a \
              "$CUDY/package/." \
              "$OPENWRT/package/"

          fi


          # ==================================================
          # CONFIG
          # ==================================================

          CONFIG_FILE=""


          echo "========================================"
          echo "Searching config..."
          echo "========================================"


          # 标准位置

          if [ -f "$CUDY/config/mt7981-QLB-4Pro.config" ]; then

            CONFIG_FILE="$CUDY/config/mt7981-QLB-4Pro.config"

          fi


          # 兼容 cudy/openwrt/.config

          if [ -z "$CONFIG_FILE" ] &&
             [ -f "$CUDY/openwrt/.config" ]; then

            CONFIG_FILE="$CUDY/openwrt/.config"

          fi


          # 兼容 cudy/.config

          if [ -z "$CONFIG_FILE" ] &&
             [ -f "$CUDY/.config" ]; then

            CONFIG_FILE="$CUDY/.config"

          fi


          if [ -z "$CONFIG_FILE" ]; then

            echo "ERROR: Cannot find config file"

            echo ""

            echo "Available config files:"

            find "$CUDY" \
              -type f \
              \( \
                -name ".config" \
                -o \
                -name "*.config" \
              \) \
              -print | sort


            exit 1

          fi


          echo "========================================"
          echo "CONFIG FOUND"
          echo "$CONFIG_FILE"
          echo "========================================"


          cp -f \
            "$CONFIG_FILE" \
            "$OPENWRT/.config"


          # ==================================================
          # SHELL SCRIPTS
          # ==================================================

          # 方案一：
          # cudy/sh/*.sh

          if [ -d "$CUDY/sh" ]; then

            find "$CUDY/sh" \
              -maxdepth 1 \
              -type f \
              -name "*.sh" \
              -exec chmod +x {} \;


            cp -a \
              "$CUDY/sh/." \
              "$OPENWRT/"

          fi


          # 方案二：
          # cudy/openwrt/diy-part*.sh

          if [ -f "$CUDY/openwrt/diy-part1.sh" ]; then

            cp -f \
              "$CUDY/openwrt/diy-part1.sh" \
              "$OPENWRT/diy-part1.sh"

          fi


          if [ -f "$CUDY/openwrt/diy-part2.sh" ]; then

            cp -f \
              "$CUDY/openwrt/diy-part2.sh" \
              "$OPENWRT/diy-part2.sh"

          fi


          # ==================================================
          # chmod
          # ==================================================

          if [ -f "$OPENWRT/diy-part1.sh" ]; then

            chmod +x \
              "$OPENWRT/diy-part1.sh"

          fi


          if [ -f "$OPENWRT/diy-part2.sh" ]; then

            chmod +x \
              "$OPENWRT/diy-part2.sh"

          fi


          # ==================================================
          # FINAL CHECK
          # ==================================================

          echo "========================================"
          echo "OPENWRT CONFIG CHECK"
          echo "========================================"


          if [ ! -f "$OPENWRT/.config" ]; then

            echo "ERROR:"
            echo "$OPENWRT/.config not found"

            exit 1

          fi


          ls -lah \
            "$OPENWRT/.config"


          echo "========================================"
          echo "DIY SCRIPTS"
          echo "========================================"


          ls -lah \
            "$OPENWRT"/diy-part*.sh \
            2>/dev/null || true


      # ------------------------------------------------------
      # Feeds
      # ------------------------------------------------------

      - name: Update Feeds
        working-directory: /workdir/openwrt
        run: |

          set -e

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ------------------------------------------------------
      # DIY PART 1
      # ------------------------------------------------------

      - name: Run DIY Part 1
        working-directory: /workdir/openwrt
        run: |

          set -e


          if [ -f "./diy-part1.sh" ]; then

            chmod +x \
              ./diy-part1.sh

            ./diy-part1.sh

          else

            echo "diy-part1.sh not found"

          fi


      # ------------------------------------------------------
      # DIY PART 2
      # ------------------------------------------------------

      - name: Run DIY Part 2
        working-directory: /workdir/openwrt
        run: |

          set -e


          if [ -f "./diy-part2.sh" ]; then

            chmod +x \
              ./diy-part2.sh

            ./diy-part2.sh

          else

            echo "diy-part2.sh not found"

          fi


      # ------------------------------------------------------
      # Verify CONFIG
      # ------------------------------------------------------

      - name: Verify OpenWrt Config
        working-directory: /workdir/openwrt
        run: |

          set -e


          echo "========================================"
          echo "PWD"
          echo "========================================"

          pwd


          echo "========================================"
          echo "CONFIG"
          echo "========================================"

          ls -lah .config


          if [ ! -f ".config" ]; then

            echo "ERROR: .config not found"

            exit 1

          fi


      # ------------------------------------------------------
      # Defconfig
      # ------------------------------------------------------

      - name: Make Defconfig
        working-directory: /workdir/openwrt
        run: |

          set -e


          echo "========================================"
          echo "MAKE DEFCONFIG"
          echo "========================================"


          pwd

          ls -lah .config


          make defconfig


          echo "========================================"
          echo "TARGET CONFIG"
          echo "========================================"


          grep \
            -E \
            'CONFIG_TARGET_|CONFIG_TARGET_DEVICE_' \
            .config \
            || true


      # ------------------------------------------------------
      # SSH
      # ------------------------------------------------------

      - name: Start SSH Session
        if: |
          github.event.inputs.mode == 'menuconfig' ||
          github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30


      # ------------------------------------------------------
      # Save Config
      # ------------------------------------------------------

      - name: Save Config
        if: always()
        run: |

          set -e


          mkdir -p \
            "$GITHUB_WORKSPACE/output"


          if [ -f "$OPENWRT_DIR/.config" ]; then

            cp -f \
              "$OPENWRT_DIR/.config" \
              "$GITHUB_WORKSPACE/output/.config"


            cp -f \
              "$OPENWRT_DIR/.config" \
              "$GITHUB_WORKSPACE/output/QLB-4Pro.config"

          fi


      # ------------------------------------------------------
      # Upload Config
      # ------------------------------------------------------

      - name: Upload Config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menuconfig-QLB-4Pro-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14



  # ==========================================================
  # BUILD
  # ==========================================================

  build:

    name: "🔨 Build QLB-4Pro"

    needs: menuconfig

    if: |
      always() &&
      (
        needs.menuconfig.result == 'success' ||
        needs.menuconfig.result == 'skipped'
      ) &&
      github.event.inputs.mode == 'build'

    runs-on: ubuntu-22.04


    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Custom Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |

          set -eux


          sudo apt-get update


          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            make \
            ninja-build \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            unzip \
            wget \
            xsltproc \
            xxd \
            zlib1g-dev \
            zstd


          sudo timedatectl \
            set-timezone "$TZ"


      # ------------------------------------------------------
      # Workdir
      # ------------------------------------------------------

      - name: Prepare Work Directory
        run: |

          set -eux


          sudo mkdir -p \
            "$WORKDIR"


          sudo chown -R \
            "$USER:$USER" \
            "$WORKDIR"


      # ------------------------------------------------------
      # Clone
      # ------------------------------------------------------

      - name: Clone ImmortalWrt
        working-directory: /workdir
        run: |

          set -eux


          git clone \
            --depth=1 \
            --single-branch \
            -b "${{ github.event.inputs.branch }}" \
            "${{ github.event.inputs.repo }}" \
            openwrt


          cd "$OPENWRT_DIR"


          if [ -n "${{ github.event.inputs.commit }}" ]; then

            git fetch \
              --depth=1 \
              origin \
              "${{ github.event.inputs.commit }}"

            git checkout \
              "${{ github.event.inputs.commit }}"

          fi


          git log \
            -1 \
            --oneline


      # ------------------------------------------------------
      # Copy Custom Files
      # ------------------------------------------------------

      - name: Copy Cudy Custom Files
        run: |

          set -eux


          OPENWRT="$OPENWRT_DIR"
          CUDY="$CUDY_DIR"


          if [ ! -d "$CUDY" ]; then

            echo "ERROR: CUDY directory not found"

            exit 1

          fi


          echo "========================================"
          echo "CUDY FILES"
          echo "========================================"


          find "$CUDY" \
            -maxdepth 5 \
            -type f \
            -print | sort


          # ==================================================
          # DTS
          # ==================================================

          if [ -d "$CUDY/dts" ]; then

            mkdir -p \
              "$OPENWRT/target/linux/mediatek/dts"


            cp -a \
              "$CUDY/dts/." \
              "$OPENWRT/target/linux/mediatek/dts/"

          fi


          # ==================================================
          # PACKAGE
          # ==================================================

          if [ -d "$CUDY/package" ]; then

            mkdir -p \
              "$OPENWRT/package"


            cp -a \
              "$CUDY/package/." \
              "$OPENWRT/package/"

          fi


          # ==================================================
          # CONFIG
          # ==================================================

          CONFIG_FILE=""


          if [ -f "$CUDY/config/mt7981-QLB-4Pro.config" ]; then

            CONFIG_FILE="$CUDY/config/mt7981-QLB-4Pro.config"

          fi


          if [ -z "$CONFIG_FILE" ] &&
             [ -f "$CUDY/openwrt/.config" ]; then

            CONFIG_FILE="$CUDY/openwrt/.config"

          fi


          if [ -z "$CONFIG_FILE" ] &&
             [ -f "$CUDY/.config" ]; then

            CONFIG_FILE="$CUDY/.config"

          fi


          if [ -z "$CONFIG_FILE" ]; then

            echo "ERROR: config file not found"


            find "$CUDY" \
              -type f \
              \( \
                -name ".config" \
                -o \
                -name "*.config" \
              \) \
              -print


            exit 1

          fi


          echo "Using config:"
          echo "$CONFIG_FILE"


          cp -f \
            "$CONFIG_FILE" \
            "$OPENWRT/.config"


          # ==================================================
          # DIY SCRIPTS
          # ==================================================

          if [ -d "$CUDY/sh" ]; then

            find "$CUDY/sh" \
              -maxdepth 1 \
              -type f \
              -name "*.sh" \
              -exec chmod +x {} \;


            cp -a \
              "$CUDY/sh/." \
              "$OPENWRT/"

          fi


          if [ -f "$CUDY/openwrt/diy-part1.sh" ]; then

            cp -f \
              "$CUDY/openwrt/diy-part1.sh" \
              "$OPENWRT/diy-part1.sh"

          fi


          if [ -f "$CUDY/openwrt/diy-part2.sh" ]; then

            cp -f \
              "$CUDY/openwrt/diy-part2.sh" \
              "$OPENWRT/diy-part2.sh"

          fi


          chmod +x \
            "$OPENWRT"/diy-part*.sh \
            2>/dev/null || true


          # ==================================================
          # IMPORTANT CHECK
          # ==================================================

          echo "========================================"
          echo "FINAL CONFIG CHECK"
          echo "========================================"


          if [ ! -f "$OPENWRT/.config" ]; then

            echo "ERROR:"
            echo "$OPENWRT/.config does not exist"

            exit 1

          fi


          ls -lah \
            "$OPENWRT/.config"


      # ------------------------------------------------------
      # Feeds
      # ------------------------------------------------------

      - name: Update Feeds
        working-directory: /workdir/openwrt
        run: |

          set -e


          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ------------------------------------------------------
      # DIY 1
      # ------------------------------------------------------

      - name: Run DIY Part 1
        working-directory: /workdir/openwrt
        run: |

          set -e


          if [ -f "./diy-part1.sh" ]; then

            chmod +x \
              ./diy-part1.sh

            ./diy-part1.sh

          else

            echo "No diy-part1.sh"

          fi


      # ------------------------------------------------------
      # DIY 2
      # ------------------------------------------------------

      - name: Run DIY Part 2
        working-directory: /workdir/openwrt
        run: |

          set -e


          if [ -f "./diy-part2.sh" ]; then

            chmod +x \
              ./diy-part2.sh

            ./diy-part2.sh

          else

            echo "No diy-part2.sh"

          fi


      # ------------------------------------------------------
      # Verify
      # ------------------------------------------------------

      - name: Verify Config
        working-directory: /workdir/openwrt
        run: |

          set -e


          echo "========================================"
          echo "OPENWRT"
          echo "========================================"

          pwd


          echo "========================================"
          echo ".config"
          echo "========================================"


          if [ ! -f ".config" ]; then

            echo "ERROR: .config not found"

            exit 1

          fi


          ls -lah \
            .config


      # ------------------------------------------------------
      # Defconfig
      # ------------------------------------------------------

      - name: Make Defconfig
        working-directory: /workdir/openwrt
        run: |

          set -e


          echo "========================================"
          echo "MAKE DEFCONFIG"
          echo "========================================"


          pwd

          ls -lah .config


          make defconfig


          echo "========================================"
          echo "TARGET"
          echo "========================================"


          grep \
            -E \
            'CONFIG_TARGET_|CONFIG_TARGET_DEVICE_' \
            .config \
            || true


      # ------------------------------------------------------
      # Config Hash
      # ------------------------------------------------------

      - name: Calculate Config Hash
        id: config_hash
        working-directory: /workdir/openwrt
        run: |

          HASH=$(md5sum .config | awk '{print $1}')


          echo "hash=$HASH" \
            >> "$GITHUB_OUTPUT"


          echo "CONFIG MD5:"
          echo "$HASH"


      # ------------------------------------------------------
      # Ccache
      # ------------------------------------------------------

      - name: Restore Ccache
        if: github.event.inputs.clean != 'true'
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache
          key: ${{ runner.os }}-ccache-${{ github.event.inputs.branch }}-${{ steps.config_hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.event.inputs.branch }}-


      # ------------------------------------------------------
      # Download Cache
      # ------------------------------------------------------

      - name: Restore Download Cache
        if: github.event.inputs.clean != 'true'
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-dl-${{ github.event.inputs.branch }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-


      # ------------------------------------------------------
      # Configure Ccache
      # ------------------------------------------------------

      - name: Configure Ccache
        run: |

          set -e


          mkdir -p \
            "$CCACHE_DIR"


          ccache \
            --set-config=cache_dir="$CCACHE_DIR"


          ccache \
            --set-config=max_size="$CCACHE_MAXSIZE"


          ccache \
            --set-config=compression=true


          ccache \
            --set-config=compression_level=6


          ccache -z


      # ------------------------------------------------------
      # Download
      # ------------------------------------------------------

      - name: Download Sources
        working-directory: /workdir/openwrt
        run: |

          set -e


          make \
            download \
            -j"$(nproc)" \
            V=s


      # ------------------------------------------------------
      # Compile
      # ------------------------------------------------------

      - name: Compile Firmware
        working-directory: /workdir/openwrt
        run: |

          set -e


          echo "========================================"
          echo "BUILD INFORMATION"
          echo "========================================"


          echo "CPU: $(nproc)"

          echo "Device: ${{ github.event.inputs.device }}"

          echo "Branch: ${{ github.event.inputs.branch }}"

          echo "Commit: $(git rev-parse HEAD)"


          echo "========================================"
          echo "BUILD START"
          echo "========================================"


          make \
            -j"$(nproc)" \
            V=s


      # ------------------------------------------------------
      # Ccache Statistics
      # ------------------------------------------------------

      - name: Ccache Statistics
        if: always()
        run: |

          ccache -s || true


      # ------------------------------------------------------
      # Collect
      # ------------------------------------------------------

      - name: Collect Firmware
        if: always()
        run: |

          set -eux


          mkdir -p \
            "$GITHUB_WORKSPACE/output"


          if [ -d "$OPENWRT_DIR/bin/targets" ]; then

            cp -a \
              "$OPENWRT_DIR/bin/targets/." \
              "$GITHUB_WORKSPACE/output/"

          fi


          if [ -f "$OPENWRT_DIR/.config" ]; then

            cp -f \
              "$OPENWRT_DIR/.config" \
              "$GITHUB_WORKSPACE/output/.config"

          fi


          if [ -f "$OPENWRT_DIR/.config.old" ]; then

            cp -f \
              "$OPENWRT_DIR/.config.old" \
              "$GITHUB_WORKSPACE/output/.config.old"

          fi


          {
            echo "========================================"
            echo "ImmortalWrt Build Information"
            echo "========================================"

            echo "Device: QLB-4Pro"

            echo "Repository: ${{ github.event.inputs.repo }}"

            echo "Branch: ${{ github.event.inputs.branch }}"

            echo "Commit: $(cd "$OPENWRT_DIR" && git rev-parse HEAD)"

            echo "Build time: $(date '+%Y-%m-%d %H:%M:%S %Z')"

            echo "CPU: $(nproc)"

            echo "Runner: $(uname -a)"

          } > \
            "$GITHUB_WORKSPACE/output/build-info.txt"


          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"


          find \
            "$GITHUB_WORKSPACE/output" \
            -type f \
            -print | sort


      # ------------------------------------------------------
      # Upload
      # ------------------------------------------------------

      - name: Upload Firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-QLB-4Pro-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
