name: ImmortalWrt Builder DIY 8621

on:
  repository_dispatch:
    types: ["Source Code Update"]

  workflow_dispatch:
    inputs:
      device:
        description: "编译设备型号"
        required: true
        type: choice
        default: "all"
        options:
          - "512M"
          - "256M"
          - "128M"
          - "QLB-4Pro"
          - "all"

      repo:
        description: "指定源码仓库地址"
        required: true
        type: string
        default: "https://github.com/immortalwrt/immortalwrt.git"

      branch:
        description: "指定源码 Branch"
        required: false
        type: string
        default: "openwrt-24.10-6.6"

      commit:
        description: "指定源码 Commit，留空使用 Branch 最新代码"
        required: false
        type: string
        default: ""

      ssh:
        description: "开启 SSH 配置，仅单设备有效"
        required: false
        type: boolean
        default: false

      release:
        description: "发布到 GitHub Release"
        required: false
        type: boolean
        default: true

      prerelease:
        description: "预发布版本"
        required: false
        type: boolean
        default: false


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  TZ: Asia/Shanghai

  # ----------------------------------------------------------
  # 编译设备
  # ----------------------------------------------------------

  DEVICE_INPUT: ${{ github.event.inputs.device || github.event.client_payload.device || 'all' }}

  # ----------------------------------------------------------
  # ImmortalWrt
  # ----------------------------------------------------------

  REPO_URL: ${{ github.event.inputs.repo || github.event.client_payload.repo || 'https://github.com/padavanonly/immortalwrt-mt798x-6.6' }}

  REPO_BRANCH: ${{ github.event.inputs.branch || github.event.client_payload.branch || 'openwrt-24.10-6.6' }}

  REPO_COMMIT: ${{ github.event.inputs.commit || github.event.client_payload.commit || '' }}

  # ----------------------------------------------------------
  # Ccache
  # ----------------------------------------------------------

  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 6G

  # ----------------------------------------------------------
  # 编译目录
  # ----------------------------------------------------------

  OPENWRT_DIR: /workdir/openwrt

  # ----------------------------------------------------------
  # Release
  # ----------------------------------------------------------

  UPLOAD_RELEASE: ${{ github.event.inputs.release || github.event.client_payload.release || 'true' }}

  PRERELEASE: ${{ github.event.inputs.prerelease || github.event.client_payload.prerelease || 'false' }}


jobs:

  # ============================================================
  # Menuconfig
  #
  # 与原模板保持一致：
  # 只有 SSH=true 且不是 all 才进入。
  # ============================================================

  menuconfig:
    name: "⚙️ Menuconfig"

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.ssh == 'true' &&
      github.event.inputs.device != 'all'

    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 最小环境
      # --------------------------------------------------------

      - name: Init Environment
        shell: bash
        run: |
          set -e

          sudo apt-get update -qq

          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            bzip2 \
            python3 \
            libncurses-dev

          sudo mkdir -p /workdir

          sudo chown -R "$(id -u):$(id -g)" /workdir


      # --------------------------------------------------------
      # Clone ImmortalWrt
      # --------------------------------------------------------

      - name: Clone Source
        working-directory: /workdir
        shell: bash
        run: |
          set -e

          git clone \
            "$REPO_URL" \
            -b "$REPO_BRANCH" \
            --single-branch \
            --filter=blob:none \
            openwrt

          cd openwrt

          if [ -n "$REPO_COMMIT" ]; then
            git fetch \
              --depth=1 \
              origin \
              "$REPO_COMMIT"

            git checkout "$REPO_COMMIT"
          fi


      # --------------------------------------------------------
      # 选择 Config
      # --------------------------------------------------------

      - name: Set Config
        shell: bash
        run: |
          set -e

          case "$DEVICE_INPUT" in
            512M)
              echo "CONFIG_FILE=config/512m.config" >> "$GITHUB_ENV"
              ;;

            256M)
              echo "CONFIG_FILE=config/256m.config" >> "$GITHUB_ENV"
              ;;

            128M)
              echo "CONFIG_FILE=config/128m.config" >> "$GITHUB_ENV"
              ;;

            QLB-4Pro)
              echo "CONFIG_FILE=config/mt7981-QLB-4Pro.config" >> "$GITHUB_ENV"
              ;;

            *)
              echo "Unknown device: $DEVICE_INPUT"
              exit 1
              ;;
          esac


      # --------------------------------------------------------
      # Feeds + DIY + Config
      # --------------------------------------------------------

      - name: Load Feeds and Config
        shell: bash
        run: |
          set -e

          chmod +x \
            diy-part1.sh \
            diy-part2.sh \
            diy-qlb.sh

          cd "$OPENWRT_DIR"

          # DIY Part 1 必须在 feeds update 前执行
          "$GITHUB_WORKSPACE/diy-part1.sh"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cp -f \
            "$GITHUB_WORKSPACE/$CONFIG_FILE" \
            .config

          # 512M / QLB 的设备定义必须在 defconfig 前加入
          case "$DEVICE_INPUT" in
            512M)
              "$GITHUB_WORKSPACE/diy-part2.sh"
              ;;

            QLB-4Pro)
              "$GITHUB_WORKSPACE/diy-qlb.sh"
              ;;
          esac

          make defconfig


      # --------------------------------------------------------
      # SSH
      # --------------------------------------------------------

      - name: SSH Session
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15


      # --------------------------------------------------------
      # 保存 Config
      # --------------------------------------------------------

      - name: Push Config
        shell: bash
        run: |
          set -e

          cp -f \
            "$OPENWRT_DIR/.config" \
            "$GITHUB_WORKSPACE/$CONFIG_FILE"

          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$CONFIG_FILE"

          if git diff --cached --quiet; then
            echo "No config changes."
            exit 0
          fi

          git commit \
            -m "Update config: ${CONFIG_FILE}"

          git pull --rebase origin main

          git push


  # ============================================================
  # Build
  # ============================================================

  build:
    name: "🔨 Build Firmware"

    needs: menuconfig

    if: >
      always() &&
      (
        needs.menuconfig.result == 'success' ||
        needs.menuconfig.result == 'skipped'
      )

    runs-on: ubuntu-22.04

    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # 编译环境
      # ========================================================

      - name: Init Environment
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo rm -rf \
            /etc/apt/sources.list.d/* \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc

          sudo apt-get update -qq

          sudo apt-get install -y \
            libncurses5-dev \
            libncurses-dev \
            liblzo2-dev \
            lzop \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            mkisofs \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd

          sudo apt-get clean

          sudo timedatectl set-timezone "$TZ"

          sudo mkdir -p /workdir

          sudo chown -R \
            "$(id -u):$(id -g)" \
            /workdir


      # ========================================================
      # Clone ImmortalWrt
      # ========================================================

      - name: Clone Source
        working-directory: /workdir
        shell: bash
        run: |
          set -e

          git clone \
            "$REPO_URL" \
            -b "$REPO_BRANCH" \
            --single-branch \
            --filter=blob:none \
            openwrt

          cd openwrt

          if [ -n "$REPO_COMMIT" ]; then

            git fetch \
              --depth=1 \
              origin \
              "$REPO_COMMIT"

            git checkout "$REPO_COMMIT"

          fi

          echo "========================================"
          echo "IMMORTALWRT"
          echo "========================================"

          echo "Branch:"
          git branch --show-current

          echo

          echo "Commit:"
          git rev-parse HEAD


      # ========================================================
      # DIY Scripts
      # ========================================================

      - name: Prepare DIY Scripts
        shell: bash
        run: |
          set -e

          chmod +x \
            diy-part1.sh \
            diy-part2.sh \
            diy-qlb.sh

          bash -n diy-part1.sh
          bash -n diy-part2.sh
          bash -n diy-qlb.sh


      # ========================================================
      # Load Feeds
      # ========================================================

      - name: Load Feeds
        shell: bash
        run: |
          set -e

          cd "$OPENWRT_DIR"

          # ----------------------------------------------------
          # Cudy DIY Part 1
          #
          # 当前仓库的 diy-part1.sh 明确设计为：
          # Before Update feeds
          # ----------------------------------------------------

          "$GITHUB_WORKSPACE/diy-part1.sh"

          # ----------------------------------------------------
          # Feeds
          # ----------------------------------------------------

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ========================================================
      # Apply Device DIY
      #
      # 必须在 make defconfig 前执行。
      # ========================================================

      - name: Apply Device DIY
        shell: bash
        run: |
          set -e

          cd "$OPENWRT_DIR"

          case "$DEVICE_INPUT" in

            512M)
              echo "========================================"
              echo "Apply TR3000 512M"
              echo "========================================"

              "$GITHUB_WORKSPACE/diy-part2.sh"
              ;;

            256M)
              echo "========================================"
              echo "TR3000 256M"
              echo "========================================"
              ;;

            128M)
              echo "========================================"
              echo "TR3000 128M"
              echo "========================================"
              ;;

            QLB-4Pro)
              echo "========================================"
              echo "Apply QLB-4Pro"
              echo "========================================"

              "$GITHUB_WORKSPACE/diy-qlb.sh"
              ;;

            all)
              echo "========================================"
              echo "Apply all device definitions"
              echo "========================================"

              # 512M device definition
              "$GITHUB_WORKSPACE/diy-part2.sh"

              # QLB-4Pro device definition
              "$GITHUB_WORKSPACE/diy-qlb.sh"
              ;;

            *)
              echo "Unknown device: $DEVICE_INPUT"
              exit 1
              ;;

          esac


      # ========================================================
      # Config Hash
      #
      # 不再复制错误的 QLB DTS。
      # 当前仓库已有正确 dts/ 文件。
      # ========================================================

      - name: Config Hash
        id: config-hash
        shell: bash
        run: |
          set -e

          cd "$OPENWRT_DIR"
          
          cp -f $GITHUB_WORKSPACE/dts/* ./target/linux/mediatek/dts/

          cat ./target/linux/mediatek/dts/mt7981b-QLB*.dts
          
          case "$DEVICE_INPUT" in

            512M)
              CONFIG="$GITHUB_WORKSPACE/config/512m.config"
              ;;

            256M)
              CONFIG="$GITHUB_WORKSPACE/config/256m.config"
              ;;

            128M)
              CONFIG="$GITHUB_WORKSPACE/config/128m.config"
              ;;

            QLB-4Pro)
              CONFIG="$GITHUB_WORKSPACE/config/mt7981-QLB-4Pro.config"
              ;;

            all)
              CONFIG="$GITHUB_WORKSPACE/config/512m.config"
              ;;

            *)
              echo "Unknown device"
              exit 1
              ;;

          esac

          cp -f "$CONFIG" .config

          make defconfig

          CONFIG_HASH=$(md5sum .config | awk '{print $1}')

          echo "hash=$CONFIG_HASH" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "CONFIG HASH"
          echo "========================================"

          echo "$CONFIG_HASH"


      # ========================================================
      # Ccache Cache
      # ========================================================

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache

          key: >-
            ${{ runner.os }}-ccache-
            ${{ env.REPO_BRANCH }}-
            ${{ steps.config-hash.outputs.hash }}-
            ${{ hashFiles('diy-*.sh', 'config/*.config', 'dts/*') }}

          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}-
            ${{ runner.os }}-ccache-


      # ========================================================
      # Download Cache
      #
      # 不绑定 config。
      # 不同设备共享下载缓存。
      # ========================================================

      - name: Cache DL
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl

          key: >-
            ${{ runner.os }}-openwrt-dl-
            ${{ env.REPO_BRANCH }}-
            ${{ hashFiles('feeds.conf.default') }}

          restore-keys: |
            ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-
            ${{ runner.os }}-openwrt-dl-


      # ========================================================
      # Configure Ccache
      # ========================================================

      - name: Configure Ccache
        shell: bash
        run: |
          set -e

          mkdir -p "$CCACHE_DIR"

          ccache \
            --set-config=max_size="$CCACHE_MAXSIZE"

          ccache \
            --set-config=cache_dir="$CCACHE_DIR"

          ccache \
            --set-config=compression=true

          ccache \
            --set-config=compression_level=6

          ccache -z


      # ========================================================
      # Download
      #
      # 关键优化：
      #
      # 原模板：
      #
      # 512M -> download
      # 256M -> download
      # 128M -> download
      # QLB  -> download
      #
      # 这里：
      #
      # 全部设备只 download 一次。
      # ========================================================

      - name: Download Sources
        shell: bash
        run: |
          set -e

          cd "$OPENWRT_DIR"

          make download -j"$(nproc)"

          find dl \
            -size -1024c \
            -exec rm -f {} \;


      # ========================================================
      # Compile Loop
      # ========================================================

      - name: Compile Loop
        id: compile
        shell: bash
        run: |
          set -e

          if [ "$DEVICE_INPUT" = "all" ]; then
            DEVICES="512M 256M 128M QLB-4Pro"
          else
            DEVICES="$DEVICE_INPUT"
          fi

          mkdir -p \
            "$GITHUB_WORKSPACE/firmware_collection"

          cd "$OPENWRT_DIR"


          for DEV in $DEVICES; do

            echo
            echo "::group::🚀 Building $DEV"

            case "$DEV" in

              512M)
                CONFIG="$GITHUB_WORKSPACE/config/512m.config"
                ;;

              256M)
                CONFIG="$GITHUB_WORKSPACE/config/256m.config"
                ;;

              128M)
                CONFIG="$GITHUB_WORKSPACE/config/128m.config"
                ;;

              QLB-4Pro)
                CONFIG="$GITHUB_WORKSPACE/config/mt7981-QLB-4Pro.config"
                ;;

              *)
                echo "Unknown device: $DEV"
                exit 1
                ;;

            esac


            echo "========================================"
            echo "DEVICE: $DEV"
            echo "CONFIG: $CONFIG"
            echo "========================================"


            # --------------------------------------------------
            # 写入设备 Config
            # --------------------------------------------------

            cp -f \
              "$CONFIG" \
              .config


            # --------------------------------------------------
            # 根据当前 Config 生成最终配置
            # --------------------------------------------------

            make defconfig


            # --------------------------------------------------
            # 显示 Target
            # --------------------------------------------------

            grep '^CONFIG_TARGET_' .config \
              | grep '=y' \
              || true


            # --------------------------------------------------
            # 编译
            # --------------------------------------------------

            if make \
              -j"$(nproc)" \
              CC="ccache gcc" \
              CXX="ccache g++"
            then

              echo "========================================"
              echo "✅ $DEV BUILD SUCCESS"
              echo "========================================"

            else

              echo "========================================"
              echo "⚠️ $DEV PARALLEL BUILD FAILED"
              echo "Retry with V=s"
              echo "========================================"

              make \
                -j1 \
                V=s \
                CC="ccache gcc" \
                CXX="ccache g++"

            fi


            # --------------------------------------------------
            # 收集当前设备
            # --------------------------------------------------

            mkdir -p \
              "$GITHUB_WORKSPACE/firmware_collection/$DEV"


            find bin/targets \
              -type f \
              \( \
                -name "*.bin" \
                -o -name "*.itb" \
                -o -name "*.img" \
                -o -name "*.tar" \
                -o -name "*.gz" \
                -o -name "*.zip" \
              \) \
              -exec cp -f {} \
              "$GITHUB_WORKSPACE/firmware_collection/$DEV/" \;


            echo "::endgroup::"

          done


          echo "status=success" >> "$GITHUB_OUTPUT"


      # ========================================================
      # Ccache Statistics
      # ========================================================

      - name: Ccache Statistics
        if: always()
        shell: bash
        run: |
          ccache -s || true


      # ========================================================
      # 上传 Artifact
      # ========================================================

      - name: Upload Artifacts
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_${{ env.DEVICE_INPUT }}
          path: ${{ github.workspace }}/firmware_collection/
          if-no-files-found: error
          compression-level: 9


      # ========================================================
      # Release
      # ========================================================

      - name: Generate Release
        id: tag
        if: >
          steps.compile.outputs.status == 'success' &&
          env.UPLOAD_RELEASE == 'true'
        shell: bash
        run: |
          set -e

          BUILD_TIME=$(date +"%Y.%m.%d-%H%M")

          echo "release_tag=$BUILD_TIME" >> "$GITHUB_OUTPUT"

          cat > release.txt << EOF
          ## 📦 ImmortalWrt Firmware

          **Build Time:** $BUILD_TIME

          **Branch:** $REPO_BRANCH

          **Commit:** $(cd "$OPENWRT_DIR" && git rev-parse --short HEAD)

          **Device:** $DEVICE_INPUT

          **Repository:** $REPO_URL
          EOF

          echo "status=success" >> "$GITHUB_OUTPUT"


      # ========================================================
      # Upload Release
      # ========================================================

      - name: Upload Release
        if: steps.tag.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          prerelease: ${{ env.PRERELEASE == 'true' }}

          files: |
            firmware_collection/**/*.bin
            firmware_collection/**/*.itb
            firmware_collection/**/*.img
            firmware_collection/**/*.tar
            firmware_collection/**/*.gz
            firmware_collection/**/*.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ========================================================
      # 清理旧 Workflow
      # ========================================================

      - name: Clean Old Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 9


      # ========================================================
      # 清理旧 Release
      # ========================================================

      - name: Clean Old Releases
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
