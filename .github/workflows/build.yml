
name: Build ImmortalWrt MT7981 QLB-4Pro

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ============================================================
  # 源码
  # ============================================================
  OPENWRT_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  OPENWRT_BRANCH: openwrt-24.10-6.6

  CUDY_REPO: https://github.com/J260121/ubi_build.git

  # ============================================================
  # 目录
  #
  # github.workspace:
  # /home/runner/work/ubi_build/ubi_build
  #
  # 所以 ../ 就是：
  # /home/runner/work/ubi_build
  #
  # 最终：
  # /home/runner/work/ubi_build/
  # ├── ubi_build/
  # ├── cudy/
  # └── openwrt/
  # ============================================================
  ROOT_DIR: ${{ github.workspace }}/..

  CUDY_DIR: ${{ github.workspace }}/../cudy
  OPENWRT_DIR: ${{ github.workspace }}/../openwrt

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. Checkout 当前仓库
      # ==========================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 安装编译依赖
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            swig \
            time \
            quilt \
            ccache

      # ==========================================================
      # 3. Clone Cudy
      #
      # https://github.com/J260121/ubi_build.git
      #
      # 目标：
      # /home/runner/work/ubi_build/cudy
      # ==========================================================
      - name: Clone Cudy source
        run: |
          set -e

          echo "======================================"
          echo "Clone Cudy source"
          echo "======================================"

          rm -rf "${CUDY_DIR}"

          git clone \
            --depth=1 \
            "${CUDY_REPO}" \
            "${CUDY_DIR}"

          echo
          echo "CUDY_DIR=${CUDY_DIR}"

          echo
          echo "===== Cudy files ====="
          find "${CUDY_DIR}" \
            -maxdepth 4 \
            -type f \
            | sort

      # ==========================================================
      # 4. Clone ImmortalWrt
      #
      # 目标：
      # /home/runner/work/ubi_build/openwrt
      # ==========================================================
      - name: Clone ImmortalWrt
        run: |
          set -e

          echo "======================================"
          echo "Clone ImmortalWrt"
          echo "======================================"

          rm -rf "${OPENWRT_DIR}"

          git clone \
            --depth=1 \
            --branch "${OPENWRT_BRANCH}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          echo
          echo "OPENWRT_DIR=${OPENWRT_DIR}"

      # ==========================================================
      # 5. 检查目录结构
      # ==========================================================
      - name: Check directory structure
        run: |
          set -e

          echo "======================================"
          echo "Directory structure"
          echo "======================================"

          echo
          echo "===== ROOT ====="
          ls -lah "${ROOT_DIR}"

          echo
          echo "===== CUDY ====="
          ls -lah "${CUDY_DIR}"

          echo
          echo "===== OPENWRT ====="
          ls -lah "${OPENWRT_DIR}"

      # ==========================================================
      # 6. 复制 DTS / package / config / sh
      # ==========================================================
      - name: Copy Cudy custom files
        run: |
          set -e

          echo "======================================"
          echo "Copy Cudy custom files"
          echo "======================================"

          # ------------------------------------------------------
          # DTS
          # ------------------------------------------------------
          echo
          echo "Copying DTS files..."

          mkdir -p \
            "${OPENWRT_DIR}/target/linux/mediatek/dts"

          cp -av \
            "${CUDY_DIR}/dts/." \
            "${OPENWRT_DIR}/target/linux/mediatek/dts/"

          # ------------------------------------------------------
          # Package
          # ------------------------------------------------------
          echo
          echo "Copying packages..."

          mkdir -p \
            "${OPENWRT_DIR}/package"

          cp -av \
            "${CUDY_DIR}/package/." \
            "${OPENWRT_DIR}/package/"

          # ------------------------------------------------------
          # Config
          # ------------------------------------------------------
          echo
          echo "Copying config..."

          cp -av \
            "${CUDY_DIR}/config/mt7981-QLB-4Pro.config" \
            "${OPENWRT_DIR}/.config"

          # ------------------------------------------------------
          # DIY scripts
          # ------------------------------------------------------
          echo
          echo "Copying shell scripts..."

          cp -av \
            "${CUDY_DIR}/sh/diy-part1.sh" \
            "${OPENWRT_DIR}/diy-part1.sh"

          cp -av \
            "${CUDY_DIR}/sh/diy-part2.sh" \
            "${OPENWRT_DIR}/diy-part2.sh"

          echo
          echo "======================================"
          echo "Deployment completed successfully."
          echo "======================================"

      # ==========================================================
      # 7. 验证复制结果
      # ==========================================================
      - name: Verify custom files
        run: |
          set -e

          echo "======================================"
          echo "Verify custom files"
          echo "======================================"

          echo
          echo "===== CONFIG ====="
          test -f \
            "${OPENWRT_DIR}/.config"

          ls -lh \
            "${OPENWRT_DIR}/.config"

          echo
          echo "===== DIY SCRIPTS ====="

          test -f \
            "${OPENWRT_DIR}/diy-part1.sh"

          test -f \
            "${OPENWRT_DIR}/diy-part2.sh"

          ls -lh \
            "${OPENWRT_DIR}/diy-part1.sh" \
            "${OPENWRT_DIR}/diy-part2.sh"

          echo
          echo "===== DTS ====="

          find \
            "${OPENWRT_DIR}/target/linux/mediatek/dts" \
            -type f \
            | sort

          echo
          echo "===== PACKAGE ====="

          find \
            "${OPENWRT_DIR}/package" \
            -maxdepth 4 \
            -type f \
            | sort

      # ==========================================================
      # 8. 执行 DIY Part 1 / Part 2
      # ==========================================================
      - name: Run Cudy DIY scripts
        run: |
          set -e

          echo "======================================"
          echo "Run Cudy DIY scripts"
          echo "======================================"

          echo
          echo "OPENWRT_DIR=${OPENWRT_DIR}"

          echo
          echo "===== Check scripts ====="

          ls -lah \
            "${OPENWRT_DIR}/diy-part1.sh" \
            "${OPENWRT_DIR}/diy-part2.sh"

          chmod +x \
            "${OPENWRT_DIR}/diy-part1.sh" \
            "${OPENWRT_DIR}/diy-part2.sh"

          echo
          echo "===== Run DIY Part 1 ====="

          cd "${OPENWRT_DIR}"

          bash ./diy-part1.sh

          echo
          echo "===== Run DIY Part 2 ====="

          bash ./diy-part2.sh

          echo
          echo "===== DIY completed ====="

      # ==========================================================
      # 9. 更新 feeds
      # ==========================================================
      - name: Update feeds
        run: |
          set -e

          cd "${OPENWRT_DIR}"

          echo "======================================"
          echo "Update feeds"
          echo "======================================"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==========================================================
      # 10. 检查配置
      # ==========================================================
      - name: Check configuration
        run: |
          set -e

          cd "${OPENWRT_DIR}"

          echo "======================================"
          echo "Check configuration"
          echo "======================================"

          test -f .config

          echo
          echo "===== Target configuration ====="

          grep -E \
            'CONFIG_TARGET_|CONFIG_TARGET_ARCH_PACKAGES' \
            .config \
            || true

          echo
          echo "===== QLB-4Pro / MT7981 ====="

          grep -Ei \
            'QLB|4Pro|MT7981' \
            .config \
            || true

      # ==========================================================
      # 11. 生成最终配置
      # ==========================================================
      - name: Generate defconfig
        run: |
          set -e

          cd "${OPENWRT_DIR}"

          echo "======================================"
          echo "Generate defconfig"
          echo "======================================"

          make defconfig

      # ==========================================================
      # 12. 编译
      # ==========================================================
      - name: Build firmware
        run: |
          set -e

          cd "${OPENWRT_DIR}"

          echo "======================================"
          echo "Build ImmortalWrt"
          echo "======================================"

          echo "CPU:"
          nproc

          echo
          echo "Starting build..."

          make -j$(nproc) V=s

      # ==========================================================
      # 13. 查看编译结果
      # ==========================================================
      - name: Check firmware output
        run: |
          set -e

          cd "${OPENWRT_DIR}"

          echo "======================================"
          echo "Firmware output"
          echo "======================================"

          if [ ! -d bin/targets ]; then
            echo "ERROR: bin/targets does not exist."
            exit 1
          fi

          find \
            bin/targets \
            -type f \
            | sort

      # ==========================================================
      # 14. 上传固件
      # ==========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-MT7981-QLB-4Pro
          path: |
            ${{ env.OPENWRT_DIR }}/bin/targets/**
          if-no-files-found: error
          retention-days: 7
