name: ImmortalWrt MT798x Cloud Builder

on:
  workflow_dispatch:
    inputs:

      mode:
        description: "编译模式"
        required: true
        type: choice
        default: build
        options:
          - build
          - menuconfig

      device:
        description: "设备配置"
        required: true
        type: choice
        default: QLB-4Pro
        options:
          - QLB-4Pro
          - 128M
          - 256M
          - 512M

      repo:
        description: "ImmortalWrt 源码仓库"
        required: true
        type: string
        default: "https://github.com/padavanonly/immortalwrt-mt798x-6.6"

      branch:
        description: "源码分支"
        required: true
        type: string
        default: "openwrt-24.10-6.6"

      commit:
        description: "指定 Commit / Tag / Branch，留空使用最新"
        required: false
        type: string
        default: ""

      ssh:
        description: "启动 SSH 调试 / Menuconfig"
        required: true
        type: boolean
        default: false

      clean:
        description: "清理编译缓存"
        required: true
        type: boolean
        default: false

concurrency:
  group: immortalwrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  WORKDIR: /workdir
  OPENWRT_DIR: /workdir/openwrt
  CUDY_DIR: ${{ github.workspace }}/cudy
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 8G

jobs:

  # ============================================================
  # Menuconfig / SSH
  # ============================================================

  menuconfig:
    name: "⚙️ Menuconfig / SSH"
    if: |
      github.event.inputs.mode == 'menuconfig' ||
      github.event.inputs.ssh == 'true'

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Custom Repository
        uses: actions/checkout@v4

      - name: Install Basic Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            rsync \
            unzip \
            zip \
            bzip2 \
            xz-utils \
            python3 \
            python3-pip \
            libncurses-dev \
            zlib1g-dev \
            libssl-dev \
            gawk \
            gettext \
            file \
            patch \
            diffutils \
            ccache

      - name: Prepare Work Directory
        run: |
          sudo mkdir -p "$WORKDIR"
          sudo chown -R "$USER:$USER" "$WORKDIR"

      - name: Clone ImmortalWrt
        working-directory: /workdir
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            -b "${{ github.event.inputs.branch }}" \
            "${{ github.event.inputs.repo }}" \
            openwrt

          cd openwrt

          if [ -n "${{ github.event.inputs.commit }}" ]; then
            git fetch --depth=1 origin "${{ github.event.inputs.commit }}"
            git checkout "${{ github.event.inputs.commit }}"
          fi

          echo "===== SOURCE ====="
          git remote -v
          git log -1 --oneline

      - name: Prepare Custom Files
        run: |
          set -eux

          OPENWRT="$OPENWRT_DIR"
          CUDY="$CUDY_DIR"

          echo "===== CUDY TREE ====="
          find "$CUDY" -maxdepth 3 -type f | sort || true

          # ----------------------------------------------------
          # DTS
          # ----------------------------------------------------

          if [ -d "$CUDY/dts" ]; then
            mkdir -p "$OPENWRT/target/linux/mediatek/dts"
            cp -a "$CUDY/dts/." \
              "$OPENWRT/target/linux/mediatek/dts/"
          fi

          # ----------------------------------------------------
          # packages
          # ----------------------------------------------------

          if [ -d "$CUDY/package" ]; then
            mkdir -p "$OPENWRT/package"
            cp -a "$CUDY/package/." \
              "$OPENWRT/package/"
          fi

          # ----------------------------------------------------
          # config
          # ----------------------------------------------------

          case "${{ github.event.inputs.device }}" in

            QLB-4Pro)
              CONFIG_FILE="$CUDY/config/mt7981-QLB-4Pro.config"
              ;;

            128M)
              CONFIG_FILE="$CUDY/config/128m.config"
              ;;

            256M)
              CONFIG_FILE="$CUDY/config/256m.config"
              ;;

            512M)
              CONFIG_FILE="$CUDY/config/512m.config"
              ;;

          esac

          if [ -f "$CONFIG_FILE" ]; then
            cp -f "$CONFIG_FILE" "$OPENWRT/.config"
            echo "Loaded config: $CONFIG_FILE"
          else
            echo "WARNING: config not found:"
            echo "$CONFIG_FILE"
          fi

          # ----------------------------------------------------
          # shell scripts
          # ----------------------------------------------------

          if [ -d "$CUDY/sh" ]; then

            find "$CUDY/sh" \
              -maxdepth 1 \
              -type f \
              -name "*.sh" \
              -exec chmod +x {} \;

            cp -a "$CUDY/sh/." "$OPENWRT/"

          fi

          # ----------------------------------------------------
          # 兼容仓库里已经存在的 diy 脚本
          # ----------------------------------------------------

          if [ -f "$OPENWRT/diy-part1.sh" ]; then
            chmod +x "$OPENWRT/diy-part1.sh"
          fi

          if [ -f "$OPENWRT/diy-part2.sh" ]; then
            chmod +x "$OPENWRT/diy-part2.sh"
          fi

          echo "===== OPENWRT CUSTOM FILES ====="

          find "$OPENWRT" \
            \( -path "$OPENWRT/.git" -o -path "$OPENWRT/dl" \) \
            -prune -o \
            -type f \
            \( -name "*.dts" -o -name "*.sh" -o -name ".config" \) \
            -print | head -100

      - name: Update Feeds
        working-directory: /workdir/openwrt
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run DIY Part 1
        working-directory: /workdir/openwrt
        run: |
          set -e

          if [ -f "./diy-part1.sh" ]; then
            chmod +x ./diy-part1.sh
            ./diy-part1.sh
          else
            echo "diy-part1.sh not found, skip."
          fi

      - name: Run DIY Part 2
        working-directory: /workdir/openwrt
        run: |
          set -e

          if [ -f "./diy-part2.sh" ]; then
            chmod +x ./diy-part2.sh
            ./diy-part2.sh
          else
            echo "diy-part2.sh not found, skip."
          fi

      - name: Generate Defconfig
        working-directory: /workdir/openwrt
        run: |
          set -e

          if [ -f ".config" ]; then
            make defconfig
          else
            echo "ERROR: .config not found"
            exit 1
          fi

      - name: SSH Menuconfig
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

      - name: Save Config
        if: always()
        run: |
          set -e

          if [ -f "$OPENWRT_DIR/.config" ]; then

            mkdir -p "$GITHUB_WORKSPACE/output"

            cp -f \
              "$OPENWRT_DIR/.config" \
              "$GITHUB_WORKSPACE/output/.config"

            cp -f \
              "$OPENWRT_DIR/.config" \
              "$GITHUB_WORKSPACE/output/${{ github.event.inputs.device }}.config"

          fi

      - name: Upload Config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menuconfig-${{ github.event.inputs.device }}
          path: |
            output/.config
            output/*.config
          if-no-files-found: warn


  # ============================================================
  # Build
  # ============================================================

  build:
    name: "🔨 Build ${{ github.event.inputs.device }}"

    needs: menuconfig

    if: |
      always() &&
      (
        needs.menuconfig.result == 'success' ||
        needs.menuconfig.result == 'skipped'
      ) &&
      github.event.inputs.mode == 'build'

    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Custom Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            make \
            ninja-build \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            unzip \
            wget \
            xsltproc \
            xxd \
            zlib1g-dev \
            zstd

          sudo timedatectl set-timezone "$TZ"

      # --------------------------------------------------------
      # Workdir
      # --------------------------------------------------------

      - name: Prepare Work Directory
        run: |
          set -eux

          sudo mkdir -p "$WORKDIR"
          sudo chown -R "$USER:$USER" "$WORKDIR"

      # --------------------------------------------------------
      # Clone
      # --------------------------------------------------------

      - name: Clone ImmortalWrt
        working-directory: /workdir
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            -b "${{ github.event.inputs.branch }}" \
            "${{ github.event.inputs.repo }}" \
            openwrt

          cd openwrt

          if [ -n "${{ github.event.inputs.commit }}" ]; then
            git fetch --depth=1 origin "${{ github.event.inputs.commit }}"
            git checkout "${{ github.event.inputs.commit }}"
          fi

          echo "===== SOURCE ====="
          git remote -v
          git log -1 --oneline

      # --------------------------------------------------------
      # Copy custom files
      # --------------------------------------------------------

      - name: Copy Cudy Custom Files
        run: |
          set -eux

          OPENWRT="$OPENWRT_DIR"
          CUDY="$CUDY_DIR"

          # DTS
          if [ -d "$CUDY/dts" ]; then
            mkdir -p "$OPENWRT/target/linux/mediatek/dts"
            cp -a "$CUDY/dts/." \
              "$OPENWRT/target/linux/mediatek/dts/"
          fi

          # Packages
          if [ -d "$CUDY/package" ]; then
            mkdir -p "$OPENWRT/package"
            cp -a "$CUDY/package/." \
              "$OPENWRT/package/"
          fi

          # Config
          case "${{ github.event.inputs.device }}" in

            QLB-4Pro)
              CONFIG_FILE="$CUDY/config/mt7981-QLB-4Pro.config"
              ;;

            128M)
              CONFIG_FILE="$CUDY/config/128m.config"
              ;;

            256M)
              CONFIG_FILE="$CUDY/config/256m.config"
              ;;

            512M)
              CONFIG_FILE="$CUDY/config/512m.config"
              ;;

          esac

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: config not found:"
            echo "$CONFIG_FILE"
            exit 1
          fi

          cp -f "$CONFIG_FILE" "$OPENWRT/.config"

          # Shell scripts
          if [ -d "$CUDY/sh" ]; then

            find "$CUDY/sh" \
              -maxdepth 1 \
              -type f \
              -name "*.sh" \
              -exec chmod +x {} \;

            cp -a "$CUDY/sh/." "$OPENWRT/"

          fi

          if [ -f "$OPENWRT/diy-part1.sh" ]; then
            chmod +x "$OPENWRT/diy-part1.sh"
          fi

          if [ -f "$OPENWRT/diy-part2.sh" ]; then
            chmod +x "$OPENWRT/diy-part2.sh"
          fi

      # --------------------------------------------------------
      # Feeds
      # --------------------------------------------------------

      - name: Update Feeds
        working-directory: /workdir/openwrt
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # --------------------------------------------------------
      # DIY 1
      # --------------------------------------------------------

      - name: Run DIY Part 1
        working-directory: /workdir/openwrt
        run: |
          set -e

          if [ -f "./diy-part1.sh" ]; then
            chmod +x ./diy-part1.sh
            ./diy-part1.sh
          fi

      # --------------------------------------------------------
      # DIY 2
      # --------------------------------------------------------

      - name: Run DIY Part 2
        working-directory: /workdir/openwrt
        run: |
          set -e

          if [ -f "./diy-part2.sh" ]; then
            chmod +x ./diy-part2.sh
            ./diy-part2.sh
          fi

      # --------------------------------------------------------
      # Defconfig
      # --------------------------------------------------------

      - name: Make Defconfig
        working-directory: /workdir/openwrt
        run: |
          set -e

          make defconfig

          echo "===== TARGET ====="
          grep -E \
            'CONFIG_TARGET_|CONFIG_TARGET_DEVICE_' \
            .config || true

      # --------------------------------------------------------
      # Config hash
      # --------------------------------------------------------

      - name: Calculate Config Hash
        id: config_hash
        working-directory: /workdir/openwrt
        run: |
          HASH=$(md5sum .config | awk '{print $1}')

          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

          echo "Config MD5:"
          echo "$HASH"

      # --------------------------------------------------------
      # Ccache
      # --------------------------------------------------------

      - name: Restore Ccache
        if: github.event.inputs.clean != 'true'
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache
          key: ${{ runner.os }}-ccache-${{ github.event.inputs.branch }}-${{ steps.config_hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.event.inputs.branch }}-

      # --------------------------------------------------------
      # Download cache
      # --------------------------------------------------------

      - name: Restore Download Cache
        if: github.event.inputs.clean != 'true'
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-dl-${{ github.event.inputs.branch }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-

      # --------------------------------------------------------
      # Configure Ccache
      # --------------------------------------------------------

      - name: Configure Ccache
        run: |
          set -e

          mkdir -p "$CCACHE_DIR"

          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6

          ccache -z

      # --------------------------------------------------------
      # Download Sources
      # --------------------------------------------------------

      - name: Download Sources
        working-directory: /workdir/openwrt
        run: |
          set -e

          make download -j$(nproc) V=s

      # --------------------------------------------------------
      # Compile
      # --------------------------------------------------------

      - name: Compile Firmware
        working-directory: /workdir/openwrt
        run: |
          set -e

          echo "========================================"
          echo "CPU: $(nproc)"
          echo "DEVICE: ${{ github.event.inputs.device }}"
          echo "BRANCH: ${{ github.event.inputs.branch }}"
          echo "========================================"

          make -j$(nproc) \
            BUILD_LOG=1 \
            V=s

      # --------------------------------------------------------
      # Ccache Statistics
      # --------------------------------------------------------

      - name: Ccache Statistics
        if: always()
        run: |
          ccache -s || true

      # --------------------------------------------------------
      # Collect Firmware
      # --------------------------------------------------------

      - name: Collect Firmware
        if: always()
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/output"

          if [ -d "$OPENWRT_DIR/bin/targets" ]; then

            cp -a \
              "$OPENWRT_DIR/bin/targets/." \
              "$GITHUB_WORKSPACE/output/"

          fi

          cp -f \
            "$OPENWRT_DIR/.config" \
            "$GITHUB_WORKSPACE/output/.config"

          if [ -f "$OPENWRT_DIR/.config.old" ]; then
            cp -f \
              "$OPENWRT_DIR/.config.old" \
              "$GITHUB_WORKSPACE/output/.config.old"
          fi

          {
            echo "Device: ${{ github.event.inputs.device }}"
            echo "Repository: ${{ github.event.inputs.repo }}"
            echo "Branch: ${{ github.event.inputs.branch }}"
            echo "Commit: $(cd "$OPENWRT_DIR" && git rev-parse HEAD)"
            echo "Build time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "Runner: $(uname -a)"
          } > "$GITHUB_WORKSPACE/output/build-info.txt"

          echo "===== OUTPUT ====="
          find "$GITHUB_WORKSPACE/output" -type f | sort

      # --------------------------------------------------------
      # Upload Firmware
      # --------------------------------------------------------

      - name: Upload Firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-${{ github.event.inputs.device }}-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
